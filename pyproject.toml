[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studyforge"
version = "0.2.0"
description = "A local-first, evidence-grounded study agent with GUI and CLI"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
report = ["reportlab>=4,<5"]

[project.scripts]
studyforge = "studyforge.cli:main"

[tool.setuptools.packages.find]
include = ["studyforge*"]

[tool.setuptools.package-data]
studyforge = ["web/*.html", "web/*.css", "web/*.js"]
